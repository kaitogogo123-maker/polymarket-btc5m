<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e13">
<title>BTC 5 分钟盘口</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:dark;--roll:linear(0, 0.0105, 0.0381, 0.0777, 0.1254, 0.1781, 0.2334, 0.2896, 0.3453, 0.3994, 0.4514, 0.5008, 0.5472, 0.5905, 0.6306, 0.6676, 0.7016, 0.7326, 0.7609, 0.7865, 0.8097, 0.8306, 0.8494, 0.8663, 0.8814, 0.895, 0.9071, 0.9179, 0.9275, 0.936, 0.9436, 0.9503, 0.9563, 0.9615, 0.9662, 0.9703, 0.9739, 0.9771, 0.9799, 0.9824, 0.9846, 0.9865, 0.9882, 0.9897, 0.991, 0.9921, 0.9931, 0.994, 0.9948, 0.9954, 0.996, 0.9965, 0.997, 0.9974, 0.9977, 0.998, 0.9983, 0.9985, 0.9987, 0.9989, 1);
--bg:#0c0e13;--card:#1c1f27;--line:#2e3138;--grid:#1f222a;--ink:#fff;--ink2:#b6bbc4;--ink3:#9a9ea8;
--up:#22b75e;--up-fill:#007723;--down:#f2484e;--down-fill:#e0121a;--up-bar:rgba(34,183,94,.14);--down-bar:rgba(242,72,78,.14);
--btc:#f7931a;--prob:#1a8cff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{height:100%;max-width:1680px;margin:auto;padding:16px 24px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
#main{min-width:0;min-height:0;display:flex;flex-direction:column}
#right{min-height:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
/* title */
#head{flex:none;display:flex;align-items:center;gap:14px}
.coin{width:52px;height:52px;border-radius:8px;background:var(--btc);display:grid;place-items:center;font-size:36px;font-weight:700;font-style:italic}
h1{margin:0;font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.36px}
#win{color:var(--ink2);font-size:16px;margin-top:2px}
/* numbers */
#stats{flex:none;min-height:60px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#btcStats{display:flex;align-items:center;gap:20px}
.num small{display:flex;gap:18px;font-size:12px;line-height:16px;font-weight:600;color:var(--ink2);white-space:nowrap}
.num b{display:block;font-size:24px;line-height:28px;font-weight:620;letter-spacing:.6px;color:var(--ink2);white-space:nowrap}
.sep{align-self:stretch;width:1px;margin:4px 0;background:var(--line)}
.cur small,.cur b{color:var(--btc)}
#delta.u{color:var(--up)}#delta.d{color:var(--down)}
#probStats small{color:var(--prob)}#probStats b{color:var(--prob)}
.pr{display:flex;align-items:center;gap:10px}#probd{font-size:12px;font-weight:600;white-space:nowrap}#probd.u{color:var(--up)}#probd.d{color:var(--down)}
#clock{display:flex;gap:18px;text-align:center}
#clock b{display:block;font-size:24px;line-height:28px;font-weight:620;letter-spacing:.6px;color:var(--down)}
#clock small{display:block;font-size:11px;line-height:15px;font-weight:600;color:var(--ink3)}
#golive{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--down-fill);flex:none}
/* chart */
#wrap{position:relative;flex:1;min-height:0;margin-top:6px}
svg{display:block}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
#cv{position:absolute;left:0;top:0;pointer-events:none}
/* a trade flies up from the left of the chart */
#fly{position:absolute;left:10px;height:0;z-index:1;pointer-events:none}
#fly div{position:absolute;left:0;bottom:0;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;text-shadow:-1px -1px 0 var(--bg),1px -1px 0 var(--bg),-1px 1px 0 var(--bg),1px 1px 0 var(--bg);transition:transform .3s ease-out,opacity .3s ease-out;animation:flyin .3s ease-out backwards}
#fly .u{color:var(--up)}#fly .d{color:var(--down)}
#fly .out{transition:transform .25s ease-in,opacity .25s ease-in}
@keyframes flyin{from{opacity:0}}
/* numbers roll digit by digit; the real text stays in .sr for reading and copying */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rl{display:inline-flex;overflow:hidden;height:var(--lh,1.25em);line-height:var(--lh,1.25em);vertical-align:baseline}
.rl i{display:block;font-style:normal;flex:none;height:var(--lh,1.25em)}
.rl .ch::before{content:attr(data-c);white-space:pre}
.rl .dg::before{content:"0\A 1\A 2\A 3\A 4\A 5\A 6\A 7\A 8\A 9";display:block;white-space:pre;transform:translateY(calc(var(--d)*var(--lh,1.25em)*-1));transition:transform .702s var(--roll)}
.rl .new{animation:flyin .2s ease-out backwards}
@supports not (transition-timing-function:linear(0,1)){.rl .dg::before{transition-timing-function:cubic-bezier(.16,1,.3,1)}}
.dot{position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.75}75%,100%{transform:scale(2);opacity:0}}
@media (pointer:coarse){.ball,#pastbtn{position:relative}.ball::after{content:"";position:absolute;inset:-11px -2.5px}#pastbtn::after{content:"";position:absolute;inset:-13px -8px -13px -13px}.pill,[data-m]{position:relative}.pill::after{content:"";position:absolute;inset:-6px 0}[data-m]::after{content:"";position:absolute;inset:-8px 0}}
label{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.rl .dg::before{transition:none}.rl .new,.dot::after,#fly div{animation:none}}
#c text{font-size:12px;fill:var(--ink3)}
.grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.dots{stroke:var(--line);stroke-width:1;stroke-dasharray:1 4;shape-rendering:crispEdges}
.base{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.target{stroke:var(--ink3);stroke-width:1;stroke-dasharray:7 7;shape-rendering:crispEdges}
.current{stroke:var(--btc);stroke-width:1;stroke-dasharray:7 7;opacity:.6;shape-rendering:crispEdges}
.btcline{fill:none;stroke:var(--btc);stroke-width:2;stroke-linejoin:round}
.probline{fill:none;stroke:var(--prob);stroke-width:2;shape-rendering:crispEdges}
.vb{fill:var(--up);shape-rendering:crispEdges}.vs{fill:var(--down);shape-rendering:crispEdges}
.hair{stroke:var(--ink3);stroke-width:1;shape-rendering:crispEdges}
#c text.pill{fill:var(--ink);font-weight:500}
#tip{position:absolute;top:6px;display:none;pointer-events:none;padding:4px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
#alert{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1;max-width:calc(100% - 24px);padding:3px 12px;border-radius:8px;background:var(--card);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* bar under the chart */
#bar{flex:none;position:relative;margin-top:10px;display:flex;align-items:center;gap:8px}
.pill{height:32px;padding:0 13px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.pill:hover{background:var(--line)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:500}
#pastgroup{display:inline-flex;align-items:center;height:32px;padding:0 10px 0 13px;border-radius:999px;background:var(--card);flex:none}
#pastbtn{display:inline-flex;align-items:center;gap:7px;padding-right:10px;margin-right:8px;border-right:1px solid var(--line);height:18px}
.chev{width:7px;height:7px;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
#balls{display:flex;gap:5px}
.ball{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1;color:var(--ink)}
.ball.u{background:var(--up-fill)}.ball.d{background:var(--down-fill)}
.ball[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
#pills{display:flex;gap:8px;min-width:0;overflow:hidden}
#pills button:focus-visible{outline-offset:-3px}
#pills button[aria-pressed=true]:focus-visible{outline-color:var(--bg)}
#toggle{margin-left:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;flex:none}
#toggle button{width:34px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink2);font-weight:700;font-style:italic;font-size:15px}
#toggle button[data-m=prob][aria-pressed=true]{background:rgba(26,140,255,.22);color:var(--prob)}
#toggle button[data-m=btc][aria-pressed=true]{background:rgba(247,147,26,.28);color:var(--btc)}
#menu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:2;width:290px;max-height:min(440px,60vh);overflow-y:auto;padding:6px;border-radius:12px;background:var(--card);border:1px solid var(--line);scrollbar-color:var(--line) transparent}
#menu button{display:grid;grid-template-columns:52px 46px 1fr;width:100%;padding:6px 10px;border-radius:7px;text-align:left}
#menu button:hover{background:var(--line)}
#menu button[aria-pressed=true]{background:var(--line);font-weight:600}
#menu .d{text-align:right}
#menu .now{grid-column:2/4;color:var(--ink2)}
#menu .none{display:block;padding:6px 10px;color:var(--ink3)}
.t-u{color:var(--up)}.t-d{color:var(--down)}
#status{flex:none;margin-top:10px;display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--ink3);font-size:13px}
#status b{font-weight:500;color:var(--ink2)}
/* right */
.card{background:var(--card);border-radius:16px}
#trade{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px}
.side{height:44px;border-radius:9.2px;display:grid;place-items:center;font-size:17px;font-weight:600;white-space:nowrap}
#upb,#downb{border:1px solid var(--line);color:var(--ink2)}
#upb.on{background:var(--up-fill);border-color:var(--up-fill);color:var(--ink)}
#downb.on{background:var(--down-fill);border-color:var(--down-fill);color:var(--ink)}
#amtrow{grid-column:1/-1;display:flex;align-items:center;gap:6px}
#amtrow label{color:var(--ink2);margin-right:auto}
#amtbox{display:flex;align-items:center;gap:2px;width:92px;height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;font-weight:600}
#amtbox:focus-within{border-color:var(--ink2)}
#amt{width:100%;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;text-align:right}
.add{height:36px;min-width:40px;padding:0 6px;border-radius:8px;background:var(--line);color:var(--ink);font-size:13px}
#est{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;color:var(--ink2);font-size:13px;white-space:nowrap}
#place{grid-column:1/-1;height:42px;border-radius:9.2px;background:var(--prob);color:var(--ink);font-weight:600}
#place:disabled{background:var(--line);color:var(--ink2);cursor:default}
#paper{flex:none;padding-bottom:6px}
#paperl .row{height:26px;grid-template-columns:auto minmax(0,1fr) auto;gap:10px}
#result{flex:none;padding:16px}
#result small{display:block;color:var(--ink2);font-size:13px}
#result b{display:block;font-size:30px;font-weight:620;margin:2px 0 8px}
#result div{display:flex;justify-content:space-between;padding-top:6px;color:var(--ink2)}
#result div span:last-child{color:var(--ink)}
.cardh{flex:none;display:flex;flex-wrap:wrap;column-gap:10px;justify-content:space-between;align-items:baseline;padding:10px 14px 8px}
.cardh strong{font-size:16px;font-weight:600;white-space:nowrap}
.cardh span{color:var(--ink2);white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;align-items:center;height:29px;padding:0 14px;text-align:right;white-space:nowrap}
.row>:first-child{text-align:left}
.row.none{color:var(--ink3)}
.colh{height:26px;border-block:1px solid var(--line);color:var(--ink3);font-size:12px;font-weight:600}
.px{font-weight:600}
#mid{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-block:1px solid var(--line);color:var(--ink2);font-size:13px;white-space:nowrap}
#bookcard{flex:none;overflow:hidden}
#tapecard{flex:1 0 220px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#tape{flex:1;min-height:0;overflow:hidden;display:flex;flex-flow:column wrap;align-content:flex-start}
#tape .row{width:100%;flex:none;height:27px;grid-template-columns:1.15fr .9fr .9fr}
#tape .time{color:var(--ink3)}
#tape .big{font-weight:700}
@media (max-width:359px){#paperl .row{grid-template-columns:minmax(0,1fr) auto}#paperl .time{display:none}#paperl .row>:nth-child(2){text-align:left}}
@media (max-height:760px){.row{height:24px}#tape .row{height:24px}}
@media (max-width:1100px){#app{grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:12px 16px}#pills .old{display:none}}
@media (max-width:820px),(max-height:560px){#bar{flex-wrap:wrap}#pills{flex-wrap:wrap;overflow:visible}html,body{height:auto}#app{display:block;height:auto;padding:12px}#wrap{height:340px;flex:none}#fly{left:4px}#right{margin-top:14px}#amt{font-size:16px}.add,#amtbox{height:44px}#place,.side{height:48px}#tapecard{height:320px;flex:none}#stats{flex-wrap:wrap}h1{font-size:20px}#win{font-size:14px}.coin{width:44px;height:44px;font-size:30px}.num b{font-size:18px;letter-spacing:0}.num small{gap:8px}#clock{gap:10px}#clock b{font-size:20px}#menu{width:100%}#menu button{padding:10px}#btcStats{gap:10px}}
</style>
</head>
<body>
<div id="app">
<section id="main">
  <div id="head"><div class="coin" aria-hidden="true">₿</div><div><h1>BTC 5分钟上涨或下跌</h1><div id="win"></div></div></div>
  <div id="stats">
    <div id="btcStats">
      <div class="num"><small>目标价格</small><b id="ptb">–</b></div>
      <i class="sep"></i>
      <div class="num cur"><small><span id="nowl">当前价格</span><span id="delta"></span></small><b id="now">–</b></div>
    </div>
    <div id="probStats" class="num" hidden><small id="probl">UP</small><div class="pr"><b id="prob">–</b><span id="probd"></span></div></div>
    <div id="clock"><div><b id="mm">–</b><small>分钟</small></div><div><b id="ss">–</b><small>秒</small></div></div>
    <button id="golive" type="button" hidden><i class="dot"></i>前往实时盘口 ›</button>
  </div>
  <div id="wrap"><div id="alert" role="status" hidden></div><svg id="c" role="img" aria-label="BTC 价格或上涨概率，以及成交量"></svg><canvas id="cv" aria-hidden="true"></canvas><div id="fly" aria-hidden="true"></div><div id="tip"></div></div>
  <div id="bar">
    <div id="pastgroup"><button id="pastbtn" type="button" aria-expanded="false">过去 <i class="chev"></i></button><div id="balls"></div></div>
    <div id="pills"></div>
    <div id="toggle">
      <button type="button" data-m="prob" title="上涨概率" aria-label="上涨概率"><svg width="17" height="15" viewBox="0 0 17 15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1v13h15"/><path d="M4 10l3.5-4 3 2.5L15 3"/></svg></button>
      <button type="button" data-m="btc" title="BTC 价格" aria-label="BTC 价格">₿</button>
    </div>
    <div id="menu" hidden></div>
  </div>
  <div id="status"></div>
</section>
<aside id="right">
  <form id="trade" class="card" autocomplete="off">
    <button type="button" id="upb" class="side"><span>Up <span id="upv">–</span></span></button><button type="button" id="downb" class="side"><span>Down <span id="downv">–</span></span></button>
    <div id="amtrow"><label for="amt">金额</label><span id="amtbox">$<input id="amt" inputmode="decimal" value="10" maxlength="7"></span>
      <button type="button" class="add" data-a="1">+1</button><button type="button" class="add" data-a="10">+10</button><button type="button" class="add" data-a="100">+100</button></div>
    <div id="est"></div>
    <button type="submit" id="place"></button>
  </form>
  <div id="paper" class="card" hidden>
    <div class="cardh"><strong>模拟记录</strong><span id="papers"></span></div>
    <div id="paperl"></div>
  </div>
  <div id="result" class="card" hidden></div>
  <div id="bookcard" class="card">
    <div class="cardh"><strong>订单簿</strong><span id="bookc"></span></div>
    <div class="row colh"><span>价格</span><span>份额</span><span>总计</span></div>
    <div id="asks"></div>
    <div id="mid"><span id="lastp"></span><span id="spread"></span></div>
    <div id="bids"></div>
  </div>
  <div id="tapecard" class="card">
    <div class="cardh"><strong>逐笔成交</strong><span id="tapec"></span></div>
    <div id="tape"></div>
  </div>
</aside>
</div>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const M = {l: 0, r: 66, t: 8, b: 22, gap: 24};
const ROWS = 5, BIG = 100, PILLS = 3;
const started = Date.now();
let note = '', tradable = false, quotaOut = false, inFlight = false, S = null, listKey = null, sel = null;
const QUIET = 30000, LOST = 120000, TROUBLE = 60000;
let retryT = null, retryGap = 1000, freshAt = Date.now(), srcNow = 0, lastTick = Date.now(), held = null, troubleAt = Date.now();
let mode = localStorage.getItem('chart') === 'prob' ? 'prob' : 'btc';

const sgn = v => v >= 0 ? '+' : '−';
const commas = t => t.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const usd = v => { if (v == null) return '–'; const [a, b] = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + commas(a) + '.' + b; };
const delta = v => v == null ? '–' : sgn(v) + usd(Math.abs(v));
const cents = v => v == null ? '–' : String(+(v * 100).toFixed(1));
const shares = v => commas(String(Math.round(v)));
const p2 = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t * 1000); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const hms = ms => { const d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); };
const qty = v => v < 1 ? '<1' : shares(v);
const clock = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function el(n, a, txt) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
function html(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
// Same number of rows: change only the text that differs, so nothing is laid out again without need.
function patch(box, rows) {
  while (box.children.length > rows.length) box.lastChild.remove();
  rows.forEach((n, i) => {
    const o = box.children[i];
    if (!o) { box.append(n); return; }
    if (o.className !== n.className) o.className = n.className;
    if (o.style.background !== n.style.background) o.style.background = n.style.background;
    if (o.children.length !== n.children.length) { o.replaceChildren(...n.childNodes); return; }
    if (!n.children.length) { if (o.textContent !== n.textContent) o.textContent = n.textContent; return; }
    for (let k = 0; k < n.children.length; k++) {
      const a = o.children[k], b = n.children[k];
      if (a.textContent !== b.textContent) a.textContent = b.textContent;
      if (a.className !== b.className) a.className = b.className;
    }
  });
}
function row(cls, vals) { const r = html('div', 'row' + (cls ? ' ' + cls : '')); for (const [t, c] of vals) r.append(html('span', c, t)); return r; }

// The price area is a canvas that rolls at 60 fps; the volume strip below stays SVG and is redrawn only when its data changes.
const bodyFont = getComputedStyle(document.body).fontFamily;
